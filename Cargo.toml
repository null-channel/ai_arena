[package]
name = "ai_arena"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
askama = "0.16.1"
clap = { version = "4.5.47", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.143"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "full"] }
async-trait = "0.1.83"
async-openai = "0.29"
rig-core = "0.39.0"
csv = "1.3.1"
duckdb = { version = "1.10501.0", features = ["bundled"] }
llm-connector = "0.5.3"
uuid = { version = "1.10", features = ["v4", "serde"] }
tabled = "0.15"
toml = "0.8"
dirs = "5.0"
chess = "3.2.0"
axum = { version = "0.8.7", features = ["ws"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["cors", "fs"] }
futures-util = "0.3.31"
rpassword = "7.4.0"
aes-gcm = "0.10.3"
pbkdf2 = "0.12.2"
rand = "0.8"
base64 = "0.22.1"
sha2 = "0.10.9"
rig = "0.39.0"

tempfile = "3.14"
